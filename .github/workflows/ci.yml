name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Repository tests run against a real PostgreSQL rather than a mocked
      # client: the ownership WHERE clauses, keyset paging boundaries and the
      # room upsert race are exactly the things a mock would agree with.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eradice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/eradice
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/eradice

    steps:
      - uses: actions/checkout@v4

      # Corepack selects the Yarn version pinned by package.json's
      # `packageManager`. Without it the runner's preinstalled Yarn 1 is used,
      # which cannot read this repository's lockfile and — more importantly —
      # ignores .yarnrc.yml entirely, silently disabling the `enableScripts:
      # false` supply-chain hardening.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # `--immutable` is Yarn 4's spelling of `--frozen-lockfile`: it fails if
      # installing would change the lockfile.
      - run: yarn install --immutable

      - run: yarn lint
      - run: yarn test

      - name: Verify migrations apply to an empty database
        run: node scripts/migrate.js

      # Runs the suite again now that the schema exists, so the repository
      # integration tests execute rather than skipping.
      - run: yarn test

      - run: yarn build
