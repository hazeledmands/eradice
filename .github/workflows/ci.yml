name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Repository tests run against a real PostgreSQL rather than a mocked
      # client: the ownership WHERE clauses, keyset paging boundaries and the
      # room upsert race are exactly the things a mock would agree with.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eradice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # TEST_DATABASE_URL is deliberately NOT set here: at job scope it would
    # also apply to the hermetic run below, which happens before the schema
    # exists. It is set on the one step that runs after migrations.
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/eradice

    steps:
      - uses: actions/checkout@v5

      # Corepack selects the Yarn version pinned by package.json's
      # `packageManager`. Without it the runner's preinstalled Yarn 1 is used,
      # which cannot read this repository's lockfile and — more importantly —
      # ignores .yarnrc.yml entirely, silently disabling the `enableScripts:
      # false` supply-chain hardening.
      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      # `--immutable` is Yarn 4's spelling of `--frozen-lockfile`: it fails if
      # installing would change the lockfile.
      - run: yarn install --immutable

      - run: yarn lint

      # Hermetic: no TEST_DATABASE_URL, so the repository suite skips. This is
      # what a contributor gets from a bare `yarn test`, and it must stay green
      # on its own.
      - name: Test (no database)
        run: yarn test

      - name: Verify migrations apply to an empty database
        run: node scripts/migrate.js

      # Now that the schema exists, run again with a database so the
      # repository integration tests actually execute.
      - name: Test (with database)
        run: yarn test
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/eradice

      - run: yarn build

  # Publishing is a JOB here rather than a separate workflow, unlike stormloop.
  # `needs: test` is the reason: it makes "the suite passed" a precondition for
  # pushing a tag, which two workflows triggered by the same push cannot express
  # — they would race, and `latest` could be published from a commit whose tests
  # were failing. It also avoids running the whole suite twice per push.
  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Pull requests build but never push: the image is verified as buildable
      # without granting fork PRs registry write or publishing a tag for code
      # that has not landed.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` and the SHA are for diagnostics and manual pinning only.
          # Argo CD Image Updater uses the semver strategy, which does not treat
          # either as a candidate — so nothing published by an ordinary push to
          # main ever deploys. That is deliberate; releasing is the Release
          # workflow's job.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_HONEYCOMB_API_KEY=${{ secrets.NEXT_PUBLIC_HONEYCOMB_API_KEY }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
