nodeLinker: node-modules

# Supply-chain hardening: do not run dependency lifecycle scripts
# (preinstall/install/postinstall) on download. This is the default in
# Yarn >= 4.14; we set it explicitly because this project is on 4.12.
# Packages that genuinely need to build are allow-listed via
# `dependenciesMeta.<name>.built: true` in package.json.
enableScripts: false
